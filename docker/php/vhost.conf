<VirtualHost *:443>
    DocumentRoot /var/www/app/public

    SSLEngine on
    SSLCertificateFile /var/www/app/docker/certs/localhost.pem
    SSLCertificateKeyFile /var/www/app/docker/certs/localhost-key.pem

    # Приложение открывается в iframe портала
    Header always unset X-Frame-Options

    <Directory /var/www/app/public>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# Для туннеля: HTTPS снаружи обеспечивает сервис туннеля
<VirtualHost *:80>
    DocumentRoot /var/www/app/public

    Header always unset X-Frame-Options

    <Directory /var/www/app/public>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
